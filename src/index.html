<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.orientation" content="portrait,landscape">
    <title>Playable ADS - Coloring Book</title>
    <style type="text/css">
      body {display:flex; justify-content:center; align-items:center; width:100%; height: 100%; background-color: #EDE8E5; margin: 0; padding: 0;}
      * {overflow: hidden;padding: 0;margin: 0;}
      .yoyo {
        animation: yoyo 1s infinite ease-in-out;
      }
      @keyframes yoyo {
        0% {
          scale: 0.1;
        }
        50% {
          scale: 0.2;
        }
        100% {
          scale: 0.1;
        }
      }
    </style>   
  </head>
  <body>
    <script src="https://pixijs.download/v8.8.1/pixi.js"></script>
  </body>
</html>
